<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | CourseLab</title><link rel="stylesheet" href="css/style.css"></head><body><a class="sr-only" href="#main">Skip to content</a><header class="site-header"><a class="brand" href="index.html">Course<span>Lab</span></a><nav class="nav" aria-label="Main navigation"><a href="index.html">Home</a></nav></header><main id="main" class="container section auth-wrap"><p class="eyebrow">CourseLab Studio</p><h1>Welcome to your workspace</h1><p class="lead">Sign in or create an instructor account to save courses securely.</p><div class="panel"><form id="auth-form"><fieldset class="auth-modes"><legend>Account action</legend><label><input type="radio" name="mode" value="signin" checked> Sign in</label><label><input type="radio" name="mode" value="signup"> Create account</label></fieldset><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password (at least 6 characters)</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button type="submit">Continue</button></form><p><button type="button" class="secondary" id="reset-password">Forgot password?</button></p><p id="auth-status" role="status" aria-live="polite"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/cloud.js"></script><script src="js/auth.js"></script></body></html>
