<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning | CourseLab</title><link rel="stylesheet" href="css/style.css"><style>
/* Expanded SCORM learner view. Only applies while playing an enrolled SCORM course. */
body.cl-scorm-fullscreen{margin:0;overflow:hidden}
body.cl-scorm-fullscreen>.site-header{display:none}
body.cl-scorm-fullscreen main.container.section{box-sizing:border-box;width:100%;max-width:none;min-width:0;height:100vh;height:100dvh;margin:0;padding:0;overflow:hidden}
body.cl-scorm-fullscreen main.container.section>:not(#lesson-area){display:none!important}
body.cl-scorm-fullscreen #lesson-area{display:block!important;box-sizing:border-box;width:100%;height:100%;margin:0;padding:0}
body.cl-scorm-fullscreen .cl-scorm-shell{box-sizing:border-box;display:flex;flex-direction:column;width:100%;height:100%;min-height:0;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:#fff}
body.cl-scorm-fullscreen .cl-scorm-topbar{box-sizing:border-box;display:flex;align-items:center;gap:14px;flex:0 0 auto;min-height:44px;padding:6px 14px;border-bottom:1px solid #d4dde5;background:#fff;font-size:13px}
body.cl-scorm-fullscreen .cl-scorm-back{white-space:nowrap;font-weight:600}
body.cl-scorm-fullscreen .cl-scorm-status{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#42556a}
body.cl-scorm-fullscreen .cl-scorm-reload{font-size:12px;line-height:1.3;padding:5px 9px;white-space:nowrap;margin:0}
body.cl-scorm-fullscreen .cl-scorm-frame{display:block;box-sizing:border-box;flex:1 1 auto;min-height:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;background:#fff}
@media(max-width:480px){body.cl-scorm-fullscreen .cl-scorm-topbar{padding-inline:8px;gap:8px}body.cl-scorm-fullscreen .cl-scorm-reload{padding:5px 7px}}
</style></head><body><header class="site-header"><a class="brand" href="index.html">Course<span>Lab</span></a><nav class="nav" aria-label="Learner navigation"><a href="index.html">Home</a><a href="learn.html" aria-current="page">My Learning</a></nav></header><main class="container section"><p class="eyebrow">CourseLab Learner</p><h1 id="page-title">My learning</h1><p id="learner-account" class="small"></p><div id="join-panel" class="panel"><h2>Join a course</h2><form id="join-form"><label for="join-code">Course enrollment code</label><input id="join-code" placeholder="CL-XXXXXXXXX" required maxlength="32"><button type="submit">Join course</button></form></div><p id="learner-status" role="status"></p><div id="learner-courses" class="course-grid"></div><div id="lesson-area" hidden><p><a href="learn.html">← All courses</a></p><h2 id="course-name"></h2><p id="version-label" class="small"></p><div class="cl-learner-layout"><aside class="cl-learner-sidebar"><div class="cl-side-head"><strong>Course lessons</strong><button type="button" class="secondary" id="toggle-lessons" aria-expanded="true" aria-controls="lesson-nav">Hide</button></div><div id="course-progress" class="small" aria-live="polite"></div><div id="lesson-nav" class="cl-lesson-menu" aria-label="Course lessons"></div></aside><section class="cl-learner-main"><h3 id="lesson-title"></h3><div id="lesson-content" aria-label="Current lesson content"></div><div class="actions cl-continue-actions"><button class="secondary" id="previous-lesson">Previous lesson</button><button id="mark-complete">Continue to next lesson →</button></div><p id="lesson-status" role="status"></p></section></div></div></main><script src="js/storage.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/cloud.js"></script><script src="js/media.js"></script><script src="js/activities.js"></script><script src="js/rise-imported.js?v=research-renderer-3"></script><script src="js/scorm-learner.js?v=fullscreen-1"></script><script src="js/learner.js"></script></body></html>
